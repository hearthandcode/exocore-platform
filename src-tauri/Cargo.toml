[package]
name = "exocore-platform"
version = "0.0.1"
description = "A local-first pre-alpha desktop workbench for governed agent and profile evaluation."
authors = ["Hearth & Code"]
license = "MIT"
repository = "https://github.com/hearthandcode/exocore-platform"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "exocore_platform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
